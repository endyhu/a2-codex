name: Deploy to GitHub Pages

# Two deploys per push: the site goes out right away (reusing the market data that is already live), then a second
# job fetches fresh prices, rebuilds and deploys again. A slow or failing price fetch never holds up the site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Keep the prices that are live now; the committed public/market.json is only the fallback if this fails.
      - name: Reuse the live market data
        continue-on-error: true
        run: |
          curl -fsS --max-time 30 https://a2codex.prezenith.com/market.json -o /tmp/market.json
          node -e "const m = JSON.parse(require('fs').readFileSync('/tmp/market.json', 'utf8')); if (!m.servers?.length || !m.items?.length) process.exit(1)"
          cp /tmp/market.json public/market.json
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  refresh:
    needs: deploy
    runs-on: ubuntu-latest
    outputs:
      fresh: ${{ steps.mark.outputs.fresh }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: snapshot
        run: node scripts/market-snapshot.mjs
        continue-on-error: true
        timeout-minutes: 15
      - name: Build with the fresh snapshot
        id: mark
        if: steps.snapshot.outcome == 'success'
        run: |
          echo "fresh=true" >> "$GITHUB_OUTPUT"
          npm run build
      - if: steps.mark.outputs.fresh == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-fresh
          path: dist

  deploy-fresh:
    needs: refresh
    if: needs.refresh.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-fresh
