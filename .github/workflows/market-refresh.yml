name: Refresh market prices

# Rebuilds and deploys the site with a fresh public/market.json every 3 hours. Nothing is committed:
# the snapshot in the repo is only the fallback used when the API is down.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # If the snapshot below fails, keep the newer of the live prices and the committed fallback instead of the old committed file.
      - name: Reuse the live market data when newer
        continue-on-error: true
        run: |
          curl -fsS --max-time 30 https://a2codex.prezenith.com/market.json -o /tmp/market.json
          node -e "const fs = require('fs'); const live = JSON.parse(fs.readFileSync('/tmp/market.json', 'utf8')), repo = JSON.parse(fs.readFileSync('public/market.json', 'utf8')); if (!live.servers?.length || !live.items?.length || Date.parse(live.generated) <= Date.parse(repo.generated)) process.exit(1)"
          cp /tmp/market.json public/market.json
      - run: node scripts/market-snapshot.mjs
        continue-on-error: true
        timeout-minutes: 15
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
